<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Job Post Detector</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #6b7385;
    --border: #dde2ee;
    --primary: #3b5bdb;
    --primary-dark: #2f49b3;
    --safe: #2b9348;
    --danger: #d62839;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  header { text-align: center; margin-bottom: 28px; }
  header h1 { margin: 0 0 6px; font-size: 1.9rem; }
  header p { margin: 0; color: var(--muted); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 10px rgba(20, 30, 60, 0.05);
  }
  .field { margin-bottom: 18px; }
  label.lbl { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; }
  .req { color: var(--danger); }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(59, 91, 219, 0.15);
  }
  textarea { resize: vertical; min-height: 90px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .checks { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 4px; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; }
  .check input { width: 18px; height: 18px; accent-color: var(--primary); }
  .section-title {
    margin: 26px 0 14px;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  .actions { display: flex; gap: 12px; margin-top: 24px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: background .15s, transform .05s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: #fff; flex: 1; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #9aa8e6; cursor: not-allowed; }
  .btn-secondary { background: #eef0f7; color: var(--text); }
  .btn-secondary:hover { background: #e1e5f2; }
  #result { margin-top: 24px; display: none; }
  .result-box { border-radius: 12px; padding: 20px; border: 2px solid; }
  .result-box.safe { background: #edf8f0; border-color: var(--safe); }
  .result-box.fake { background: #fdeef0; border-color: var(--danger); }
  .result-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 4px; }
  .safe .result-title { color: var(--safe); }
  .fake .result-title { color: var(--danger); }
  .result-sub { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; }
  .bar { height: 12px; background: #e6e9f2; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; border-radius: 99px; transition: width .6s ease; }
  .safe .bar-fill { background: var(--safe); }
  .fake .bar-fill { background: var(--danger); }
  .bar-label { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 6px; color: var(--muted); }
  .error {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #fdeef0;
    color: var(--danger);
    border: 1px solid var(--danger);
    display: none;
  }
  .note { margin-top: 18px; font-size: 0.8rem; color: var(--muted); text-align: center; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🕵️ Fake Job Post Detector</h1>
    <p>Paste the details of a job posting and let the model check whether it looks fraudulent.</p>
  </header>

  <form id="jobForm" class="card" autocomplete="off">
    <div class="field">
      <label class="lbl" for="title">Job Title <span class="req">*</span></label>
      <input type="text" id="title" placeholder="e.g. Data Entry Clerk - Work From Home" required>
    </div>

    <div class="field">
      <label class="lbl" for="company_profile">Company Profile</label>
      <textarea id="company_profile" placeholder="About the company..."></textarea>
    </div>

    <div class="field">
      <label class="lbl" for="description">Job Description</label>
      <textarea id="description" placeholder="Responsibilities and details of the role..."></textarea>
    </div>

    <div class="field">
      <label class="lbl" for="requirements">Requirements</label>
      <textarea id="requirements" placeholder="Skills, qualifications, experience..."></textarea>
    </div>

    <div class="section-title">Job Details</div>
    <div class="grid">
      <div class="field">
        <label class="lbl" for="employment_type">Employment Type</label>
        <select id="employment_type">
          <option>Unknown</option>
          <option>Full-time</option>
          <option>Part-time</option>
          <option>Contract</option>
          <option>Temporary</option>
          <option>Other</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="required_experience">Experience Level</label>
        <select id="required_experience">
          <option>Unknown</option>
          <option>Internship</option>
          <option>Entry level</option>
          <option>Associate</option>
          <option>Mid-Senior level</option>
          <option>Director</option>
          <option>Executive</option>
          <option>Not Applicable</option>
        </select>
      </div>
      <div class="field">
        <label class="lbl" for="required_education">Education</label>
        <select id="required_education">
          <option>Unknown</option>
          <option>High School or equivalent</option>
          <option>Some High School Coursework</option>
          <option>Some College Coursework Completed</option>
          <option>Vocational</option>
          <option>Vocational - HS Diploma</option>
          <option>Vocational - Degree</option>
          <option>Associate Degree</option>
          <option>Bachelor's Degree</option>
          <option>Master's Degree</option>
          <option>Doctorate</option>
          <option>Certification</option>
          <option>Professional</option>
          <option>Unspecified</option>
        </select>
      </div>
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" id="telecommuting"> Remote / telecommuting</label>
      <label class="check"><input type="checkbox" id="has_company_logo" checked> Has company logo</label>
      <label class="check"><input type="checkbox" id="has_questions"> Has screening questions</label>
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" id="submitBtn">Check Job Post</button>
      <button type="button" class="btn-secondary" id="resetBtn">Clear</button>
    </div>

    <div class="error" id="error"></div>

    <div id="result">
      <div class="result-box" id="resultBox">
        <p class="result-title" id="resultTitle"></p>
        <p class="result-sub" id="resultSub"></p>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="bar-label"><span>Likely genuine</span><span id="probText"></span><span>Likely fraudulent</span></div>
      </div>
    </div>
  </form>

  <p class="note">This is a machine learning estimate, not a guarantee. Always verify employers independently.</p>
</div>

<script>
  const form = document.getElementById("jobForm");
  const submitBtn = document.getElementById("submitBtn");
  const resetBtn = document.getElementById("resetBtn");
  const resultWrap = document.getElementById("result");
  const resultBox = document.getElementById("resultBox");
  const errorBox = document.getElementById("error");

  const val = id => document.getElementById(id).value.trim();
  const flag = id => (document.getElementById(id).checked ? 1 : 0);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    resultWrap.style.display = "none";

    const payload = {
      title: val("title"),
      company_profile: val("company_profile"),
      description: val("description"),
      requirements: val("requirements"),
      employment_type: document.getElementById("employment_type").value,
      required_experience: document.getElementById("required_experience").value,
      required_education: document.getElementById("required_education").value,
      telecommuting: flag("telecommuting"),
      has_company_logo: flag("has_company_logo"),
      has_questions: flag("has_questions")
    };

    submitBtn.disabled = true;
    submitBtn.textContent = "Analyzing...";

    try {
      const res = await fetch("/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Server returned " + res.status);
      const data = await res.json();
      showResult(data);
    } catch (err) {
      errorBox.textContent = "Could not get a prediction: " + err.message;
      errorBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Check Job Post";
    }
  });

  function showResult(data) {
    // The API returns the key "fradulent" (spelling as in app.py)
    const isFake = (data.fradulent ?? data.fraudulent) === 1;
    const pct = Math.round(data.probability * 100);

    resultBox.className = "result-box " + (isFake ? "fake" : "safe");
    document.getElementById("resultTitle").textContent =
      isFake ? "⚠️ Likely a FAKE job post" : "✅ Looks like a genuine job post";
    document.getElementById("resultSub").textContent = isFake
      ? "The model flagged this posting as potentially fraudulent. Be careful sharing personal info or paying fees."
      : "The model did not find strong signs of fraud in this posting.";
    document.getElementById("probText").textContent = pct + "% fraud probability";

    resultWrap.style.display = "block";
    const fill = document.getElementById("barFill");
    fill.style.width = "0";
    requestAnimationFrame(() => { fill.style.width = pct + "%"; });
    resultWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  resetBtn.addEventListener("click", () => {
    form.reset();
    document.getElementById("has_company_logo").checked = true;
    resultWrap.style.display = "none";
    errorBox.style.display = "none";
  });
</script>
</body>
</html>
